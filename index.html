<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zuper Web OS — Concept Prototype (React)</title>
  <meta name="description" content="A design-concept exploration of labs.zuper.co as a desktop-OS shell, built with React + Tailwind. Not the real site." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inconsolata:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
  <style>
    /* Type scale for a dense retro desktop OS — per direct reference. Deliberately
       smaller/tighter than the boot-screen-style 17-18px JetBrains Mono that inspired
       the font choice: that worked because the cookie dialog it came from is one big
       isolated retro interface, but a whole desktop OS at that size reads as a pixel-art
       poster, not a dense old OS. Each component below picks the matching tier — see
       the table in project notes for the full element -> tier mapping. */
    :root {
      --font-pixel: 'JetBrains Mono', 'Inconsolata', 'Courier New', monospace;
      --text-xs: 10px;
      --text-sm: 12px;
      --text-md: 14px;
      --text-lg: 16px;
      --text-xl: 20px;
    }
    html, body, #root { height: 100%; margin: 0; background: #040200; }
    /* Platform-wide font is JetBrains Mono (OFL-licensed, freely usable) per direct
       reference — used for every piece of UI text (body copy, chrome, terminal) except
       the "ZUPER LABS" background watermark, which intentionally keeps its own VT323
       treatment (see GlitchWatermark in app.jsx). */
    body { font-family: 'JetBrains Mono', 'Inconsolata', 'Courier New', monospace; -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
    /* OS-chrome text (icon labels, window titles, badges, taskbar) stays a clean readable
       mono at a real size, with a drop shadow for contrast against the animated background —
       the same trick windows93.net/real desktop OSes use for icon labels over wallpaper. */
    .font-mono { font-family: 'JetBrains Mono', 'Inconsolata', 'Courier New', monospace !important; text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 1px rgba(0,0,0,.6); }
    /* Terminal/shell output — same platform-wide font, not the old VT323 retro-terminal
       treatment, so the shell reads consistently with the rest of the UI. */
    .font-terminal { font-family: 'JetBrains Mono', 'Inconsolata', monospace !important; letter-spacing: .01em; }
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,176,0,.28);
      box-shadow: inset 1px 1px 0 #ffdb8d, inset -1px -1px 0 #040200;
    }
    ::-webkit-scrollbar-track { background: rgba(20,10,0,.4); box-shadow: inset 1px 1px 0 #040200, inset -1px -1px 0 #3a2214; }

    /* Tailwind's browser CDN JIT unreliably generates CSS for opacity-slash utilities in this
       app (confirmed: it silently drops most text-white/N, border-white/N, bg-white/N, and even
       plain opacity-40 — leaving those elements with NO color rule, which resolves to black).
       Rather than depend on that scanner, every such utility actually used in app.jsx gets an
       explicit, guaranteed rule here. */
    .text-white\/40 { color: rgba(255,255,255,.40) !important; }
    .text-white\/48 { color: rgba(255,255,255,.48) !important; }
    .text-white\/58 { color: rgba(255,255,255,.58) !important; }
    .text-white\/68 { color: rgba(255,255,255,.68) !important; }
    .text-white\/72 { color: rgba(255,255,255,.72) !important; }
    .text-white\/78 { color: rgba(255,255,255,.78) !important; }
    .text-white\/85 { color: rgba(255,255,255,.85) !important; }
    .text-white\/88 { color: rgba(255,255,255,.88) !important; }
    .text-white\/92 { color: rgba(255,255,255,.92) !important; }
    .border-white\/10 { border-color: rgba(255,255,255,.10) !important; }
    .border-white\/15 { border-color: rgba(255,255,255,.15) !important; }
    .border-white\/25 { border-color: rgba(255,255,255,.25) !important; }
    .border-white\/30 { border-color: rgba(255,255,255,.30) !important; }
    .bg-white\/5 { background-color: rgba(255,255,255,.05) !important; }
    .bg-white\/10 { background-color: rgba(255,255,255,.10) !important; }
    .border-red-400\/50 { border-color: rgba(248,113,113,.5) !important; }
    .opacity-40 { opacity: .4 !important; }
    button:disabled.disabled\:opacity-40 { opacity: .4 !important; }
    button:hover.hover\:border-white\/30:not(:disabled) { border-color: rgba(255,255,255,.30) !important; }
    button:hover.hover\:border-white\/25:not(:disabled) { border-color: rgba(255,255,255,.25) !important; }
    button:hover.hover\:bg-white\/5:not(:disabled) { background-color: rgba(255,255,255,.05) !important; }
    button:hover.hover\:bg-white\/10:not(:disabled) { background-color: rgba(255,255,255,.10) !important; }
    button:hover.hover\:text-white:not(:disabled) { color: #fff !important; }
    a:hover.hover\:bg-white\/5 { background-color: rgba(255,255,255,.05) !important; }
    .pointer-events-none { pointer-events: none !important; }
    .overflow-y-auto { overflow-y: auto !important; }
    .overflow-x-hidden { overflow-x: hidden !important; }
    @keyframes zuper-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    /* Arcade game "juice" — shared across Pipe Flow / Spinning Plates / Fraud or
       Fine?: a shake on failure, a floating score/status pop that drifts up and
       fades, and a pulsing warning state for anything about to fail. */
    @keyframes arcade-shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
    @keyframes arcade-pop-fade { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-30px) scale(1.15); } }
    @keyframes arcade-pulse-critical { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    /* Assistant mascot animation states — original, hand-built states (idle blink,
       greeting ear-wiggle, thinking head-tilt, tail-wag) in the same spirit as a
       classic assistant character's named animations, but our own transforms on our
       own drawn shapes, not borrowed sprite frames. */
    @keyframes dog-blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.12); } }
    @keyframes dog-ear-wiggle { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-10deg); } }
    @keyframes dog-think-tilt { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-5deg); } }
    /* Real CSS 3D transform (perspective + rotateY) on the whole mascot SVG — genuine
       3D depth on a flat drawing, a much lighter-weight way to get visible
       dimensionality than a full WebGL/Three.js rewrite. */
    @keyframes mascot-3d-tilt { 0%, 100% { transform: perspective(420px) rotateY(0deg); } 50% { transform: perspective(420px) rotateY(16deg); } }
    /* Hover-notice (a quick "perk up" perspective bump on pointer-enter) and idle
       fidget (a small unprompted head wobble on a randomized timer) — the extra
       always-alive touch/idle reactivity classic assistant characters have, built
       from scratch as CSS transforms on this original character. */
    @keyframes mascot-notice { 0% { transform: perspective(420px) rotateY(0deg) scale(1); } 35% { transform: perspective(420px) rotateY(-10deg) scale(1.08); } 65% { transform: perspective(420px) rotateY(6deg) scale(1.03); } 100% { transform: perspective(420px) rotateY(0deg) scale(1); } }
    @keyframes mascot-fidget { 0%, 100% { transform: rotate(0deg); } 20% { transform: rotate(-4deg); } 40% { transform: rotate(3deg); } 60% { transform: rotate(-2deg); } 80% { transform: rotate(1deg); } }
    /* A hard on/off opacity toggle — how a real terminal cursor blinks — for the
       CRT-robot mascot's >_ glyph, distinct from dog-blink's eyelid squash. */
    @keyframes term-cursor-blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    /* Screen-content states for the CRT-robot mascot: a loading-dots pulse while
       thinking/processing, and a bright scan bar that sweeps down the screen for a
       "get attention" glitch-scan effect on hover. */
    @keyframes dot-pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes screen-scan-sweep {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: .6; }
      85% { opacity: .6; }
      100% { transform: translateY(32px); opacity: 0; }
    }
    .assistant-eye { transform-box: fill-box; transform-origin: center; animation: dog-blink 4.5s ease-in-out infinite; }
    /* Used by the CRT-robot mascot's own screen-scanline ambient flicker only — the
       full-screen CRTOverlay (vignette + moving sweep band) and the watermark's
       glitch/breathe animations were removed on request; this one keyframe is still
       live on the mascot. */
    @keyframes crt-flicker { 0%, 100% { opacity: .015; } 50% { opacity: .035; } 92% { opacity: .06; } }
    @keyframes crt-icon-glow { 0%, 100% { filter: drop-shadow(0 0 2px currentColor); } 50% { filter: drop-shadow(0 0 6px currentColor); } }
    html { cursor: default; }
    ::selection { background: rgba(255,176,0,.35); color: #fff3e0; }
    /* CRT menu/list rows — a bright-amber hover highlight (not white) and a classic
       "> " selection cursor prefix, inspired by real phosphor-terminal UIs (amber
       phosphor monitors were a real, common alternate to green in retro computing). */
    .crt-item { position: relative; transition: background-color .1s; }
    .crt-item:hover { background-color: rgba(255,176,0,.14) !important; }
    .crt-item::before { content: ">"; position: absolute; left: 4px; top: 50%; transform: translateY(-50%); opacity: 0; transition: opacity .1s; color: #ffb000; font-family: 'VT323', monospace; font-size: 1.1em; }
    .crt-item:hover::before { opacity: 1; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react" src="./app.jsx"></script>
</body>
</html>
