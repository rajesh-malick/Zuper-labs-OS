<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zuper Web OS — Concept Prototype (React)</title>
  <meta name="description" content="A design-concept exploration of labs.zuper.co as a desktop-OS shell, built with React + Tailwind. Not the real site." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inconsolata:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
  <!-- Vercel Web Analytics, added zero-config per the product review's #1 finding:
       nothing anywhere tracked page loads, which clusters/games got opened, or where
       visitors dropped off before the careers puzzle — the only quantified signal was
       the solver counter for people who finished the WHOLE challenge, nothing about the
       funnel above it. This is the plain-HTML install (no build step here to run
       `import { inject } from '@vercel/analytics'` through), same script Vercel's own
       framework integrations load under the hood. app.jsx's trackEvent() helper calls
       window.va('event', {...}) for the specific funnel steps worth seeing (careers
       opened, Level 1/2 solved, email submitted, Ghost Subscribe opened) — safe no-op
       if window.va isn't defined yet or Web Analytics isn't turned on for this project.
       One-time setup still needed on Vercel's side: Project -> Analytics tab -> Enable
       (free on Hobby/Pro) — there's no API/CLI in this environment to flip that toggle. -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <!-- The real Ghost "Portal" member-signup widget, embedded exactly as labs.zuper.co
       itself embeds it (same script, same data-key/data-api — copied verbatim from
       the live site's own <head>). This is the genuine widget talking to the real
       Ghost backend, not a mockup of it: it self-injects its own floating trigger
       (hidden here via CSS below, since the taskbar's own Subscribe link triggers it
       instead) and intercepts clicks on any element with data-portal="signup"
       anywhere on the page to open the real signup modal in place, with no page
       navigation. Verified working cross-origin before shipping. -->
  <script defer src="https://cdn.jsdelivr.net/ghost/portal@~2.37/umd/portal.min.js" data-i18n="false" data-ghost="https://labs.zuper.co/" data-key="98895e45fa4fb6745f2462726b" data-api="https://labs.zuper.co/ghost/api/content/" crossorigin="anonymous"></script>
  <script>
    /* Portal renders its own default floating "Subscribe" trigger inside an iframe
       it injects at #ghost-portal-root (same-origin/scriptable via srcdoc, no
       sandboxing) — redundant and visually inconsistent with this OS's own taskbar
       Subscribe link, which triggers the exact same real modal (app.jsx's
       openGhostSignup finds and clicks this same internal trigger element directly,
       since Portal's own [data-portal] auto-wiring can't see elements React renders
       after Portal's one-time DOM scan already ran).

       Two SEPARATE things needed fixing here, found by testing real clicks (not just
       JS-invoked ones, which bypass hit-testing and so falsely looked fine):
       1) Cosmetic: hide the default trigger's visible content. A plain outer <style>
          can't reach inside the iframe's own document, so this polls briefly for that
          document's <head> and injects one rule into it.
       2) The actual bug: while collapsed/idle, Portal keeps that iframe element
          pinned at fixed bottom-right with z-index 3999998 — which sits directly on
          top of this OS's own taskbar Subscribe link and silently swallows real mouse
          clicks aimed at it, even though nothing visible is there once (1) hides its
          content. A JS-driven toggle (checking the iframe's collapsed-vs-open size on
          every style mutation) was tried first here and reliably worked once things
          had settled for a few seconds, but a click landing in the first moment or
          two after Portal creates its iframe could still slip through before that JS
          had run even once — any JS fix has to run AFTER the element exists, which is
          exactly the gap. Fixed for real with a static CSS rule below
          (#ghost-portal-root iframe — pointer-events: none), which the browser
          applies to that element the instant it exists, no JS/timing gap at all.
          openGhostSignup (app.jsx) explicitly flips it to `auto` itself the moment a
          click actually reaches our own Subscribe link, so the real modal is
          interactive once open; this script just watches for the iframe collapsing
          back down afterward and clears that override so the default `none` governs
          again.

       On slower connections (production, not localhost) Portal's own React
       component re-renders and swaps in a BRAND NEW iframe element at least once
       during its own startup (fetching site config/member state) — attaching the
       fix once to the first iframe found isn't enough, since that element can become
       a detached, no-longer-current node with nothing watching the real one. So this
       watches #ghost-portal-root itself for childList changes and re-applies setup to
       whatever iframe is current each time, in addition to the initial poll for the
       root existing at all. */
    (function () {
      function setupIframe(ifr) {
        if (ifr.__zuperSetup) return;
        ifr.__zuperSetup = true;
        function injectHideStyle() {
          var doc = ifr.contentDocument || (ifr.contentWindow && ifr.contentWindow.document);
          if (doc && doc.head && !doc.getElementById("zuper-os-hide-trigger")) {
            var style = doc.createElement("style");
            style.id = "zuper-os-hide-trigger";
            style.textContent = "[class*='triggerbtn-container']{visibility:hidden!important;}";
            doc.head.appendChild(style);
          }
        }
        function syncPointerEvents() {
          /* position: fixed = the small default-trigger state; position: relative =
             the real open modal covering the viewport — a discrete value Portal sets
             directly, not animated, unlike width (which passes through several
             intermediate values while animating open, some coincidentally small
             enough that an earlier width-based check misfired mid-animation).
             Bidirectional on purpose, not just "clear once collapsed": Portal
             sometimes swaps in a brand new iframe element for the open state rather
             than reusing the collapsed one, and openGhostSignup's own explicit
             `auto` (app.jsx) only ever touches whatever iframe existed at click-time
             — a freshly-swapped-in open iframe would otherwise start from the static
             `none` default and nothing would ever flip it back to `auto`. Syncing to
             the current position on every observed mutation self-heals regardless of
             which specific element is currently in the DOM. */
          ifr.style.pointerEvents = ifr.style.position === "fixed" ? "" : "auto";
        }
        injectHideStyle();
        syncPointerEvents();
        new MutationObserver(function () { injectHideStyle(); syncPointerEvents(); })
          .observe(ifr, { attributes: true, attributeFilter: ["style"] });
        ifr.addEventListener("load", injectHideStyle);
      }
      function watchRoot() {
        var root = document.getElementById("ghost-portal-root");
        if (!root) { setTimeout(watchRoot, 250); return; }
        var current = root.querySelector("iframe");
        if (current) setupIframe(current);
        new MutationObserver(function () {
          var cur = root.querySelector("iframe");
          if (cur) setupIframe(cur);
        }).observe(root, { childList: true });
      }
      watchRoot();
    })();
  </script>
  <style>
    /* Static default — see the script above for why this has to be plain CSS and
       not JS-applied: the browser matches it the instant the iframe element exists,
       with no timing gap a real early click could slip through. */
    #ghost-portal-root iframe { pointer-events: none; }
    /* Type scale for a dense retro desktop OS — per direct reference. Deliberately
       smaller/tighter than the boot-screen-style 17-18px JetBrains Mono that inspired
       the font choice: that worked because the cookie dialog it came from is one big
       isolated retro interface, but a whole desktop OS at that size reads as a pixel-art
       poster, not a dense old OS. Each component below picks the matching tier — see
       the table in project notes for the full element -> tier mapping. */
    /* Design-token palette — sampled directly from the paper-craft wallpaper photo, so
       these match it exactly rather than approximating it. Mirrored as plain hex JS
       constants in app.jsx (BG_CREAM/OLIVE_GROUND/CHARCOAL/ICON_CARD/ACCENT_ORANGE/
       TEXT_PRIMARY/TEXT_SECONDARY) — kept in sync manually rather than read via
       getComputedStyle, since several call sites (bevel()'s shade() math, canvas-drawn
       icons) need real hex values to do arithmetic on, not a `var(--x)` reference a
       browser resolves at paint time. Chrome-scoped only: this replaces the OS shell's
       amber/black CRT palette (taskbar, Start menu, window chrome, icon labels,
       context/quick-launcher menus) — Terminal.app's own text, every window CONTENT
       pane (readme/dashboard/quiz/arcade), the boot screen, and the mobile fallback are
       deliberately untouched; CRT_GREEN (app.jsx) still drives all of those exactly as
       before. */
    :root {
      --bg-cream: #EEE1C8;
      --olive-ground: #968B5F;
      --charcoal: #605756;
      --icon-card: #4F4138;
      --accent-orange: #E67E38;
      --text-primary: #F5F0E8;
      --text-secondary: #B8A98E;
      --font-pixel: 'JetBrains Mono', 'Inconsolata', 'Courier New', monospace;
      --text-xs: 10px;
      --text-sm: 12px;
      --text-md: 14px;
      --text-lg: 16px;
      --text-xl: 20px;
    }
    html, body, #root { height: 100%; margin: 0; background: #040200; }
    /* Platform-wide DEFAULT stays JetBrains Mono — deliberately not flipped to sans
       here, even though most chrome now reads Inter (see .font-chrome below). Doing it
       the other way (defaulting body to sans, then re-asserting mono per element) would
       silently flip any content-pane text that doesn't carry its own explicit font
       class over to sans by inheritance — this codebase can't fully guarantee every
       readme/dashboard/quiz/arcade text node has one. Keeping mono as the safe
       inherited fallback and having chrome opt INTO sans explicitly is the direction
       that can't accidentally re-theme content it was never asked to touch. */
    body { font-family: 'JetBrains Mono', 'Inconsolata', 'Courier New', monospace; -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
    /* OS-chrome text (icon labels, window titles, badges, taskbar) stays a clean readable
       mono at a real size, with a drop shadow for contrast against the animated background —
       the same trick windows93.net/real desktop OSes use for icon labels over wallpaper.
       Still used by every window CONTENT pane and Terminal.app's own text — untouched. */
    .font-mono { font-family: 'JetBrains Mono', 'Inconsolata', 'Courier New', monospace !important; text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 1px rgba(0,0,0,.6); }
    /* Terminal/shell output — same platform-wide font, not the old VT323 retro-terminal
       treatment, so the shell reads consistently with the rest of the UI. */
    .font-terminal { font-family: 'JetBrains Mono', 'Inconsolata', monospace !important; letter-spacing: .01em; }
    /* OS-chrome sans — Inter (already loaded above), replacing .font-mono specifically
       on the taskbar/Start menu/context menu/quick launcher/window titles/icon labels/
       assistant widget. No text-shadow here on purpose: several of these elements (icon
       labels especially) already set their own precisely-tuned inline text-shadow for
       legibility against the photo, and a !important shadow here would silently
       clobber it since !important classes beat inline styles regardless of
       specificity. The rest sit on the new translucent charcoal glass panels, not the
       raw photo, so they don't need one. */
    .font-chrome { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif !important; }
    /* Audit finding: OS-level furniture, visible everywhere (chrome and content alike),
       still on the old amber/near-black CRT colors. Moved onto the new tokens for the
       same reason ::selection below did — a color-only change, not a font one, so it
       doesn't risk re-theming content text the way flipping body's font-family would. */
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-thumb {
      background: rgba(230,126,56,.32);
      box-shadow: inset 1px 1px 0 rgba(245,240,232,.55), inset -1px -1px 0 #040200;
    }
    ::-webkit-scrollbar-track { background: rgba(79,65,56,.35); box-shadow: inset 1px 1px 0 #040200, inset -1px -1px 0 rgba(79,65,56,.6); }

    /* Tailwind's browser CDN JIT unreliably generates CSS for opacity-slash utilities in this
       app (confirmed: it silently drops most text-white/N, border-white/N, bg-white/N, and even
       plain opacity-40 — leaving those elements with NO color rule, which resolves to black).
       Rather than depend on that scanner, every such utility actually used in app.jsx gets an
       explicit, guaranteed rule here. */
    .text-white\/40 { color: rgba(255,255,255,.40) !important; }
    .text-white\/48 { color: rgba(255,255,255,.48) !important; }
    .text-white\/58 { color: rgba(255,255,255,.58) !important; }
    .text-white\/68 { color: rgba(255,255,255,.68) !important; }
    .text-white\/72 { color: rgba(255,255,255,.72) !important; }
    .text-white\/78 { color: rgba(255,255,255,.78) !important; }
    .text-white\/85 { color: rgba(255,255,255,.85) !important; }
    .text-white\/88 { color: rgba(255,255,255,.88) !important; }
    .text-white\/92 { color: rgba(255,255,255,.92) !important; }
    .border-white\/10 { border-color: rgba(255,255,255,.10) !important; }
    .border-white\/15 { border-color: rgba(255,255,255,.15) !important; }
    .border-white\/25 { border-color: rgba(255,255,255,.25) !important; }
    .border-white\/30 { border-color: rgba(255,255,255,.30) !important; }
    .bg-white\/5 { background-color: rgba(255,255,255,.05) !important; }
    .bg-white\/10 { background-color: rgba(255,255,255,.10) !important; }
    .border-red-400\/50 { border-color: rgba(248,113,113,.5) !important; }
    .opacity-40 { opacity: .4 !important; }
    button:disabled.disabled\:opacity-40 { opacity: .4 !important; }
    button:hover.hover\:border-white\/30:not(:disabled) { border-color: rgba(255,255,255,.30) !important; }
    button:hover.hover\:border-white\/25:not(:disabled) { border-color: rgba(255,255,255,.25) !important; }
    button:hover.hover\:bg-white\/5:not(:disabled) { background-color: rgba(255,255,255,.05) !important; }
    button:hover.hover\:bg-white\/10:not(:disabled) { background-color: rgba(255,255,255,.10) !important; }
    button:hover.hover\:text-white:not(:disabled) { color: #fff !important; }
    a:hover.hover\:bg-white\/5 { background-color: rgba(255,255,255,.05) !important; }
    .pointer-events-none { pointer-events: none !important; }
    /* Guaranteed since it's overriding the desktop stage's own select-none (a real
       user-select inheritance bug: Terminal output was impossible to select/copy at
       all until this was added — see TerminalWindow in app.jsx). */
    .select-text { user-select: text !important; -webkit-user-select: text !important; }
    .overflow-y-auto { overflow-y: auto !important; }
    .overflow-x-hidden { overflow-x: hidden !important; }
    @keyframes zuper-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    /* Arcade game "juice" — shared across Pipe Flow / Spinning Plates / Fraud or
       Fine?: a shake on failure, a floating score/status pop that drifts up and
       fades, and a pulsing warning state for anything about to fail. */
    @keyframes arcade-shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
    @keyframes arcade-pop-fade { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-30px) scale(1.15); } }
    @keyframes arcade-pulse-critical { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    /* Assistant mascot animation states — original, hand-built states (idle blink,
       greeting ear-wiggle, thinking head-tilt, tail-wag) in the same spirit as a
       classic assistant character's named animations, but our own transforms on our
       own drawn shapes, not borrowed sprite frames. */
    @keyframes dog-blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.12); } }
    @keyframes dog-ear-wiggle { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-10deg); } }
    @keyframes dog-think-tilt { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-5deg); } }
    /* Real CSS 3D transform (perspective + rotateY) on the whole mascot SVG — genuine
       3D depth on a flat drawing, a much lighter-weight way to get visible
       dimensionality than a full WebGL/Three.js rewrite. */
    @keyframes mascot-3d-tilt { 0%, 100% { transform: perspective(420px) rotateY(0deg); } 50% { transform: perspective(420px) rotateY(16deg); } }
    /* Hover-notice (a quick "perk up" perspective bump on pointer-enter) and idle
       fidget (a small unprompted head wobble on a randomized timer) — the extra
       always-alive touch/idle reactivity classic assistant characters have, built
       from scratch as CSS transforms on this original character. */
    @keyframes mascot-notice { 0% { transform: perspective(420px) rotateY(0deg) scale(1); } 35% { transform: perspective(420px) rotateY(-10deg) scale(1.08); } 65% { transform: perspective(420px) rotateY(6deg) scale(1.03); } 100% { transform: perspective(420px) rotateY(0deg) scale(1); } }
    @keyframes mascot-fidget { 0%, 100% { transform: rotate(0deg); } 20% { transform: rotate(-4deg); } 40% { transform: rotate(3deg); } 60% { transform: rotate(-2deg); } 80% { transform: rotate(1deg); } }
    /* A hard on/off opacity toggle — how a real terminal cursor blinks — for the
       CRT-robot mascot's >_ glyph, distinct from dog-blink's eyelid squash. */
    @keyframes term-cursor-blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    /* dot-pulse: a loading-dots/glow-ring pulse, used by the assistant's thinking
       indicator and its ambient glow ring. (screen-scan-sweep, the old CRT-robot's
       hover "get attention" scan bar, was removed along with the rest of that
       character's screen-content states — no longer applicable to the logo-based
       assistant.) */
    @keyframes dot-pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    .assistant-eye { transform-box: fill-box; transform-origin: center; animation: dog-blink 4.5s ease-in-out infinite; }
    /* mascot-breathe: a continuous, gentle scale pulse on the logo-based assistant's
       inner content (glow ring + logo) — this is what makes it read as a living thing
       rather than a static app icon now that it's a flat logo mark instead of an
       animated character screen. Always running, layered on a separate nested element
       so it composes with the outer plate's own tilt/notice/fidget transforms instead
       of fighting them for the same `transform` property. */
    @keyframes mascot-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.055); } }
    /* nudge-in: entrance for the proactive suggestion bubble near the assistant. */
    @keyframes nudge-in { 0% { opacity: 0; transform: translateY(6px) scale(.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes crt-icon-glow { 0%, 100% { filter: drop-shadow(0 0 2px currentColor); } 50% { filter: drop-shadow(0 0 6px currentColor); } }
    html { cursor: default; }
    ::selection { background: rgba(230,126,56,.35); color: #F5F0E8; }
    /* Chrome menu/list rows — an orange hover highlight (was amber) and a ">" selection
       cursor prefix. font-family dropped from the arrow glyph (was VT323, the retro-
       terminal font) — it now just inherits whatever the row's own font is (Inter via
       .font-chrome for every chrome menu; content lists that still use .crt-item, if
       any, keep inheriting their own mono). */
    .crt-item { position: relative; transition: background-color .1s; }
    .crt-item:hover { background-color: rgba(230,126,56,.16) !important; }
    .crt-item::before { content: ">"; position: absolute; left: 4px; top: 50%; transform: translateY(-50%); opacity: 0; transition: opacity .1s; color: #E67E38; font-size: 1.1em; }
    .crt-item:hover::before { opacity: 1; }
    /* Design-review finding: only DesktopIcon and the assistant widget's trigger button
       had an explicit focus-visible style anywhere in the app - everywhere else (Start
       menu items, context menu items, window minimize/maximize/close, every Arcade Play
       button, the Subscribe link, etc.) fell back to the browser default, which measured
       as a near-black 0.67px outline in this app's dark chrome - effectively invisible to
       a keyboard-only visitor. A single low-specificity rule here covers every element
       that doesn't already set its own outline; it's deliberately plain :focus-visible
       (specificity 0-0-1-0) so it loses to any component's own Tailwind
       `focus-visible:outline-*` classes (0-0-2-0) rather than fighting them - the two
       places that already do this correctly are untouched. outline-offset is negative
       (inset) rather than the more common positive offset specifically so it can never
       get clipped by a parent's overflow-hidden/overflow-y-auto (context menus, the Start
       menu list, scrollable window content all have one).

       Caught live, not assumed: a single fixed amber outline (this app's one accent
       color) is invisible on the Start button, which is itself filled solid amber -
       same color on same color, confirmed via computed style, not a guess - and would
       have hit the same problem on at least one Arcade Play button too (each game gets
       its own accent color around the color wheel, including a yellow one). A single
       color can't guarantee contrast against every fill this app already uses for its
       own UI. Two rings instead: a light inset ring (reads against dark chrome and any
       saturated accent fill) plus a dark ring just outside the element's own edge
       (reads against the wallpaper's light cream regions). Between the two, at least
       one is always visible regardless of what's behind or inside the focused element. */
    :focus-visible {
      outline: 2px solid rgba(255,255,255,.95);
      outline-offset: -2px;
      box-shadow: 0 0 0 4px rgba(4,2,0,.75);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react" src="./app.jsx"></script>
</body>
</html>
